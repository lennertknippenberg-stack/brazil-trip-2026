name: Trip status

on:
  schedule:
    - cron: "0 11 * * *" # 06:00 Medellín, 08:00 Brazil
  issues:
    types: [opened, closed, reopened, edited, milestoned, demilestoned]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: trip-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # latest README, not the commit the event fired on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update labels, defaults and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/status.py
      - name: Commit README
        run: |
          git add -N status.svg index.html 2>/dev/null || true
          if ! git diff --quiet README.md status.svg index.html; then
            git config user.name "trip-bot"
            git config user.email "trip-bot@users.noreply.github.com"
            git add README.md status.svg index.html
            git commit -m "Update trip status"
            git push
          fi
